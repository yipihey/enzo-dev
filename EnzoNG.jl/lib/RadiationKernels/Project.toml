name = "RadiationKernels"
uuid = "1a2b3c4d-0010-4000-8000-000000000010"
authors = ["T. Abel and contributors"]
version = "0.1.0"

# A KernelAbstractions.jl two-moment (M1) radiative-transfer port for EnzoNG --
# the GPU-native counterpart to Enzo's adaptive ray tracing. It carries the
# moment system (Nγ, Fγ) per photon group with the Levermore M1 closure
# (Aubert & Teyssier 2008; RAMSES-RT, Rosdahl+ 2013), transported by a
# dimensionally-split global-Lax-Friedrichs scheme, and couples back to the
# ChemistryKernels network through per-cell photo-ionization / photo-heating
# (the RadiativeTransferIonization / H2II / LW source terms). Written ONCE and
# run on the CPU (f64 oracle + f32) and Metal (f32-only, Apple GPU).
#
# Why M1 and not a faithful adaptive-ray-trace port: ray tracing is irregular
# photon-package traversal across AMR with MPI transport -- it does not map to a
# flat KA kernel. M1 is a stencil + per-cell update, the same shape as the hydro
# and Poisson kernels, so it is genuinely GPU-efficient.
[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"

[weakdeps]
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"

[extensions]
RadiationKernelsMetalExt = "Metal"

[compat]
Adapt = "3, 4"
KernelAbstractions = "0.9"
Metal = "1"
julia = "1.10"
