name = "ChemistryKernels"
uuid = "1a2b3c4d-0009-4000-8000-000000000009"
authors = ["T. Abel and contributors"]
version = "0.1.0"

# A KernelAbstractions.jl port of Enzo's non-equilibrium primordial chemistry +
# radiative-cooling network -- the calc_rates / cool1d_multi / solve_rate_cool
# Fortran chain (Abel, Anninos, Zhang & Norman 1997) -- written ONCE and run on
# the CPU (the f64 parity oracle + f32 reference) and on Metal (f32-only, Apple
# GPU).  The network is *switchable* at the call site: 6-species (MultiSpecies=1,
# H/He only), 9-species (=2, +H2/H2+/H-) and 12-species (=3, +D/D+/HD) are the
# same precision- AND size-generic kernel specialised on `Val{nspecies}`.
#
# Metal is a *weak* dependency loaded through a package extension so the core
# precompiles headless and on non-Apple CI; only the f64-vs-Fortran layer runs
# there, the Metal parity/accuracy layers light up wherever `using Metal` works.
[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"

[weakdeps]
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"

[extensions]
ChemistryKernelsMetalExt = "Metal"

[compat]
Adapt = "3, 4"
KernelAbstractions = "0.9"
Metal = "1"
julia = "1.10"
