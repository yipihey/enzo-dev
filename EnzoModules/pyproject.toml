[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enzomodules"
version = "0.1.0"
description = "Extracted, fixture-certified, ctypes-callable legacy Enzo compute kernels"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "EnzoNG developers" }]
license = { text = "BSD-3-Clause" }
# Intentionally dependency-free: only the standard library + ctypes, so the
# package and its plain-text fixtures are trivially reusable downstream.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["enzomodules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
